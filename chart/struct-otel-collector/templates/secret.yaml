{{- if not .Values.ingest.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "struct-otel-collector.fullname" . }}
  labels:
    {{- include "struct-otel-collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  ingest-key: {{ required "Set ingest.key to the workspace's ingest key, or ingest.existingSecret to a Secret that holds it" .Values.ingest.key | quote }}
{{- end }}
