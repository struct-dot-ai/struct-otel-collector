name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Run release rule tests
        run: uv run --group dev python -m pytest -q tests/test_release.py
      - name: Run install script tests
        run: uv run python tests/test_install.py
      # Pull the upstream image's GHCR copy (same digest) and tag it with the
      # Docker Hub name the Dockerfile uses, so nothing pulls from Docker Hub.
      - name: Pull the upstream image under the name the Dockerfile uses
        run: |
          upstream=$(sed -n 's/^FROM otel\/opentelemetry-collector-contrib:\(.*\)$/\1/p' Dockerfile)
          docker pull "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:$upstream"
          docker tag "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:$upstream" "otel/opentelemetry-collector-contrib:$upstream"
      - name: Run config tests
        run: uv run python tests/test_configs.py
      - name: Run chart tests
        run: uv run python tests/test_chart.py
      - name: Run end-to-end tests
        run: uv run python tests/test_end_to_end.py
