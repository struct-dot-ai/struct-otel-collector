# Preset: one node's share of a Kubernetes cluster. Run one collector per node
# (the chart's DaemonSet): node, pod and container metrics from the kubelet,
# and every pod's logs, each stamped with the pod's Kubernetes identity.
#
# Needs a service account that can read nodes/stats and watch pods (the chart
# creates it), the node's /var/log/pods mounted read-only, and read access to
# those files, which on most nodes means running as root.
#
# Settings (the chart sets the first four from the pod's own fields):
#   K8S_NODE_NAME        required; the node's name (spec.nodeName)
#   STRUCT_KUBELET_ENDPOINT   required; the node's kubelet, as a whole URL:
#                        https://<node address>:10250. The address and not the
#                        name, which often does not resolve from inside a pod.
#                        An IPv6 address goes in brackets: https://[2001:db8::1]:10250
#   K8S_POD_NAMESPACE    required; this collector's own namespace
#   K8S_POD_NAME         required; this collector's own pod name
#   STRUCT_KUBERNETES_INTERVAL   default 60s

receivers:
  kubelet_stats:
    collection_interval: ${env:STRUCT_KUBERNETES_INTERVAL:-60s}
    auth_type: serviceAccount
    endpoint: ${env:STRUCT_KUBELET_ENDPOINT}
    # Kubelet serving certificates are usually self-signed. The request still
    # carries the service account token, and the kubelet authorizes it.
    insecure_skip_verify: true
    node: ${env:K8S_NODE_NAME}
    metric_groups: [node, pod, container]
  file_log/pods:
    include: [/var/log/pods/*/*/*.log]
    # Not this collector's own log: a line about a failed export would
    # otherwise be read back and exported again.
    exclude: ["/var/log/pods/${env:K8S_POD_NAMESPACE}_${env:K8S_POD_NAME}_*/*/*.log"]
    start_at: end
    include_file_path: true
    include_file_name: false
    # Read positions are kept in the state directory, so a restart continues
    # where it stopped.
    storage: file_storage/struct
    operators:
      # Parses the container runtime's line format and takes the namespace, pod,
      # container and pod UID from the file path.
      - type: container
        id: container-parser

processors:
  k8s_attributes/node:
    auth_type: serviceAccount
    passthrough: false
    filter:
      node_from_env_var: K8S_NODE_NAME
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.node.name
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.cronjob.name
        - k8s.job.name
        - k8s.container.name
        - container.image.name
        # Not the image's tag: `container.image.tag` is a name the processor no
        # longer sends (it only warns, since upstream 0.162.0), and its
        # replacement, `container.image.tags`, would be a new attribute.
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: resource_attribute
            name: k8s.pod.name
          - from: resource_attribute
            name: k8s.namespace.name
  # service.name is the workload that owns the pod, or `kubernetes` for
  # node-level series. Never replaces a name that is already there.
  transform/kubernetes_service_name:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil and attributes["k8s.deployment.name"] != nil
          - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["service.name"] == nil and attributes["k8s.statefulset.name"] != nil
          - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["service.name"] == nil and attributes["k8s.daemonset.name"] != nil
          - set(attributes["service.name"], attributes["k8s.cronjob.name"]) where attributes["service.name"] == nil and attributes["k8s.cronjob.name"] != nil
          - set(attributes["service.name"], attributes["k8s.job.name"]) where attributes["service.name"] == nil and attributes["k8s.job.name"] != nil
          - set(attributes["service.name"], attributes["k8s.pod.name"]) where attributes["service.name"] == nil and attributes["k8s.pod.name"] != nil
          - set(attributes["service.name"], "kubernetes") where attributes["service.name"] == nil
    log_statements:
      - context: resource
        statements:
          - set(attributes["service.name"], attributes["k8s.deployment.name"]) where attributes["service.name"] == nil and attributes["k8s.deployment.name"] != nil
          - set(attributes["service.name"], attributes["k8s.statefulset.name"]) where attributes["service.name"] == nil and attributes["k8s.statefulset.name"] != nil
          - set(attributes["service.name"], attributes["k8s.daemonset.name"]) where attributes["service.name"] == nil and attributes["k8s.daemonset.name"] != nil
          - set(attributes["service.name"], attributes["k8s.cronjob.name"]) where attributes["service.name"] == nil and attributes["k8s.cronjob.name"] != nil
          - set(attributes["service.name"], attributes["k8s.job.name"]) where attributes["service.name"] == nil and attributes["k8s.job.name"] != nil
          - set(attributes["service.name"], attributes["k8s.pod.name"]) where attributes["service.name"] == nil and attributes["k8s.pod.name"] != nil
          - set(attributes["service.name"], "kubernetes") where attributes["service.name"] == nil

service:
  pipelines:
    metrics/kubernetes_node:
      receivers: [kubelet_stats]
      processors: [memory_limiter, k8s_attributes/node, transform/kubernetes_service_name, resource_detection/struct]
      exporters: [otlp_http/struct]
    logs/kubernetes_pods:
      receivers: [file_log/pods]
      processors: [memory_limiter, k8s_attributes/node, transform/kubernetes_service_name, resource_detection/struct]
      exporters: [otlp_http/struct]
